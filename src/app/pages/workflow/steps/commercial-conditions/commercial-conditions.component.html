<div class="step-container">
    <h3>Condições Contratuais</h3>

    <form [formGroup]="form" (ngSubmit)="submitForm()">

        <app-form-field label="Prazo do Contrato (meses)" id="duration" [control]="durationControl">
            <input type="text" id="duration" formControlName="duration" class="form-control" min="1">
        </app-form-field>

        <app-form-field label="Valor Total" id="totalValue" [control]="totalValueControl">
            <input type="text" id="totalValue" formControlName="totalValue" class="form-control" min="0" step="0.01">
        </app-form-field>

        <app-form-field label="Forma de Pagamento" id="paymentMethod" [control]="paymentMethodControl">
            <select id="paymentMethod" formControlName="paymentMethod" class="form-control">
                <option value="">Selecione</option>
                <option value="monthly">Mensal</option>
                <option value="quarterly">Trimestral</option>
                <option value="semianuual">Semestral</option>
                <option value="annual">Anual</option>
                <option value="upfront">À Vista</option>
            </select>
        </app-form-field>

        <app-form-field label="Observações" id="notes" [control]="notesControl">
            <textarea id="notes" formControlName="notes" class="form-control" rows="4"></textarea>
        </app-form-field>

        <div class="form-actions">
            <app-button type="button" variant="secondary" (onClick)="goBack()">Voltar</app-button>
            <app-button type="submit" [disabled]="form.invalid">Continuar</app-button>
        </div>
    </form>
</div>
